# Builds the Windows installer and publishes it as a GitHub release whenever a version tag (v1.2.3) is pushed,
# or on demand from the Actions tab. The landing page's "Download for Windows" button fetches
# releases/latest/download/TodoEase-Setup.exe, so the asset name must not change.
#
# Optional secrets / variables:
# - GOOGLE_CLIENT_JSON (secret): contents of backend/MyTodoEase.Api/google-client.json, the desktop OAuth client for
#   the Google Calendar connection. Without it the installer still works; Settings > Google Calendar then asks the
#   user to paste a client.
# - SIGNPATH_API_TOKEN (secret) + SIGNPATH_ORGANIZATION_ID (variable): once the project is accepted by the SignPath
#   Foundation, the unsigned installer is submitted to SignPath and the signed one is released instead. The project
#   and policy slugs below must match the SignPath project configuration.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore the Google OAuth client (optional)
        if: ${{ env.GOOGLE_CLIENT_JSON != '' }}
        shell: pwsh
        run: Set-Content -Path backend/MyTodoEase.Api/google-client.json -Value $env:GOOGLE_CLIENT_JSON -Encoding utf8

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build

      # The unsigned installer is always kept as a workflow artifact; SignPath (when configured) picks it up from here.
      - name: Upload unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: TodoEase-Setup-unsigned
          path: release/TodoEase-Setup.exe

      - name: Sign installer (SignPath Foundation)
        if: ${{ env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: TodoEase
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release/signed

      - name: Choose the installer to publish
        id: installer
        shell: pwsh
        run: |
          $signed = 'release/signed/TodoEase-Setup.exe'
          $path = if (Test-Path $signed) { $signed } else { 'release/TodoEase-Setup.exe' }
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing $path"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.installer.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Keep the published installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodoEase-Setup
          path: ${{ steps.installer.outputs.path }}
