# Builds the Windows installer and publishes it as a GitHub release whenever a version tag (v1.2.3) is pushed,
# or on demand from the Actions tab. The landing page's "Download for Windows" button fetches
# releases/latest/download/MyTodoEase-Setup.exe, so the asset name must not change.
#
# Optional secret GOOGLE_CLIENT_JSON: the contents of backend/MyTodoEase.Api/google-client.json (the desktop OAuth
# client for the Google Calendar connection). Without it the installer still works; Settings > Google Calendar then
# asks the user to paste a client.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore the Google OAuth client (optional)
        if: ${{ env.GOOGLE_CLIENT_JSON != '' }}
        shell: pwsh
        run: Set-Content -Path backend/MyTodoEase.Api/google-client.json -Value $env:GOOGLE_CLIENT_JSON -Encoding utf8
      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/MyTodoEase-Setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Keep the installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTodoEase-Setup
          path: release/MyTodoEase-Setup.exe
