<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" role="img" aria-label="MyTodoEase">
  <defs>
    <!-- Deep-space tile with blue and magenta nebula hints -->
    <radialGradient id="neb-blue" cx="0.12" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#2f5bff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#2a3cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2a3cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb-pink" cx="0.9" cy="0.85" r="0.8">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#b43cff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#b43cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb-violet" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7b3fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7b3fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Neon rim -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fd2ff"/>
      <stop offset="0.45" stop-color="#8b5cff"/>
      <stop offset="0.8" stop-color="#ff5fd2"/>
      <stop offset="1" stop-color="#ff8a9a"/>
    </linearGradient>
    <!-- Row colours: blue, violet-pink, pink-orange -->
    <linearGradient id="row1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9be9ff"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
    <linearGradient id="row2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9b6ff"/><stop offset="1" stop-color="#ff7ae0"/></linearGradient>
    <linearGradient id="row3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb0e0"/><stop offset="1" stop-color="#ffb07a"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="0.6"/></filter>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f8cff"/><stop offset="0.55" stop-color="#7b4dff"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient>
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="16"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0d0b36"/>
  <g clip-path="url(#tile)">
    <rect x="2" y="2" width="60" height="60" fill="url(#neb-blue)"/>
    <rect x="2" y="2" width="60" height="60" fill="url(#neb-violet)"/>
    <rect x="2" y="2" width="60" height="60" fill="url(#neb-pink)"/>
  </g>
  <!-- Rim glow then crisp rim -->
  <rect x="2.8" y="2.8" width="58.4" height="58.4" rx="15.4" fill="none" stroke="url(#rim)" stroke-width="3" stroke-opacity="0.55" filter="url(#glow)"/>
  <rect x="2.8" y="2.8" width="58.4" height="58.4" rx="15.4" fill="none" stroke="url(#rim)" stroke-width="1.4"/>

  <!-- Star specks -->
  <g fill="#ffffff">
    <circle cx="44" cy="13" r="0.9" opacity="0.95"/>
    <circle cx="36" cy="22" r="0.6" opacity="0.8"/>
    <circle cx="54" cy="28" r="0.5" opacity="0.7"/>
    <circle cx="14" cy="27" r="0.5" opacity="0.6"/>
    <circle cx="40" cy="37" r="0.5" opacity="0.7"/>
    <circle cx="48" cy="46" r="0.7" opacity="0.8"/>
    <circle cx="31" cy="52" r="0.8" opacity="0.9"/>
    <circle cx="13" cy="49" r="0.5" opacity="0.6"/>
  </g>

  <!-- Rows: comet trail (glow + crisp) curling up into a dot, and a four-point star -->
  <g fill="none" stroke-linecap="round">
    <path d="M21 19 C31 19.4, 40 17.6, 46 14.8 C49 13.4, 51 11.4, 50.6 9.2" stroke="url(#row1)" stroke-width="3" stroke-opacity="0.45" filter="url(#glow)"/>
    <path d="M21 19 C31 19.4, 40 17.6, 46 14.8 C49 13.4, 51 11.4, 50.6 9.2" stroke="url(#row1)" stroke-width="1.5"/>
    <path d="M21 32 C31 32.4, 40 30.6, 46 27.8 C49 26.4, 51 24.4, 50.6 22.2" stroke="url(#row2)" stroke-width="3" stroke-opacity="0.45" filter="url(#glow)"/>
    <path d="M21 32 C31 32.4, 40 30.6, 46 27.8 C49 26.4, 51 24.4, 50.6 22.2" stroke="url(#row2)" stroke-width="1.5"/>
    <path d="M21 45 C31 45.4, 40 43.6, 46 40.8 C49 39.4, 51 37.4, 50.6 35.2" stroke="url(#row3)" stroke-width="3" stroke-opacity="0.45" filter="url(#glow)"/>
    <path d="M21 45 C31 45.4, 40 43.6, 46 40.8 C49 39.4, 51 37.4, 50.6 35.2" stroke="url(#row3)" stroke-width="1.5"/>
  </g>
  <g fill="#ffffff">
    <circle cx="50.6" cy="9.2" r="1.3" fill="#bfefff" filter="url(#glow-soft)"/><circle cx="50.6" cy="9.2" r="0.9"/>
    <circle cx="50.6" cy="22.2" r="1.3" fill="#ffc2f0" filter="url(#glow-soft)"/><circle cx="50.6" cy="22.2" r="0.9"/>
    <circle cx="50.6" cy="35.2" r="1.3" fill="#ffd2b0" filter="url(#glow-soft)"/><circle cx="50.6" cy="35.2" r="0.9"/>
  </g>
  <g>
    <path transform="translate(16 19) scale(0.9)" d="M0 -8 C0.9 -2.6, 2.6 -0.9, 8 0 C2.6 0.9, 0.9 2.6, 0 8 C-0.9 2.6, -2.6 0.9, -8 0 C-2.6 -0.9, -0.9 -2.6, 0 -8 Z" fill="#8fd8ff" filter="url(#glow)"/>
    <path transform="translate(16 19) scale(0.75)" d="M0 -8 C0.9 -2.6, 2.6 -0.9, 8 0 C2.6 0.9, 0.9 2.6, 0 8 C-0.9 2.6, -2.6 0.9, -8 0 C-2.6 -0.9, -0.9 -2.6, 0 -8 Z" fill="#ffffff"/>
    <path transform="translate(16 32) scale(0.9)" d="M0 -8 C0.9 -2.6, 2.6 -0.9, 8 0 C2.6 0.9, 0.9 2.6, 0 8 C-0.9 2.6, -2.6 0.9, -8 0 C-2.6 -0.9, -0.9 -2.6, 0 -8 Z" fill="#e2a8ff" filter="url(#glow)"/>
    <path transform="translate(16 32) scale(0.75)" d="M0 -8 C0.9 -2.6, 2.6 -0.9, 8 0 C2.6 0.9, 0.9 2.6, 0 8 C-0.9 2.6, -2.6 0.9, -8 0 C-2.6 -0.9, -0.9 -2.6, 0 -8 Z" fill="#ffffff"/>
    <path transform="translate(16 45) scale(0.9)" d="M0 -8 C0.9 -2.6, 2.6 -0.9, 8 0 C2.6 0.9, 0.9 2.6, 0 8 C-0.9 2.6, -2.6 0.9, -8 0 C-2.6 -0.9, -0.9 -2.6, 0 -8 Z" fill="#ffb8d8" filter="url(#glow)"/>
    <path transform="translate(16 45) scale(0.75)" d="M0 -8 C0.9 -2.6, 2.6 -0.9, 8 0 C2.6 0.9, 0.9 2.6, 0 8 C-0.9 2.6, -2.6 0.9, -8 0 C-2.6 -0.9, -0.9 -2.6, 0 -8 Z" fill="#ffffff"/>
  </g>
  <text x="78" y="43" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#202020" letter-spacing="-0.5">MyTodo<tspan fill="url(#brand)" font-weight="800">Ease</tspan></text>
</svg>
