services:
  mongo:
    image: mongo:7
    container_name: mytodoease-mongo
    restart: unless-stopped
    # Host port 27018 so this never collides with a MongoDB installed as a Windows service on 27017.
    # Point Mongo.ConnectionString at mongodb://localhost:27018 to use this container.
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
